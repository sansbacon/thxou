{% extends "base.html" %}{% block title %}Sign in · thxou{% endblock %}{% block content %}<h1>Sign in</h1><p>We'll send a one-time code to your phone.</p><form method="post" action="{{ url_for('main.otp_request') }}"><input type="hidden" name="next" value="{{ next_path }}"><label>Country<select name="country"><option>United States (+1)</option></select></label><label>Phone<input name="phone" type="tel" autocomplete="tel" value="{{ pending_phone|default('') }}" required></label><input type="hidden" name="captcha_token" value=""><button>Send code</button></form>{% if sent %}<form method="post" action="{{ url_for('main.otp_verify') }}"><input type="hidden" name="next" value="{{ next_path }}"><input type="hidden" name="phone" value="{{ pending_phone }}"><label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" required></label><button>Verify code</button></form>{% endif %}{% endblock %}
