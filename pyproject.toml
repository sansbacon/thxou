[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thxou"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Flask==3.1.0",
  "httpx==0.28.1",
  "python-dotenv==1.0.1",
]

[tool.setuptools.packages.find]
include = ["thxou*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
